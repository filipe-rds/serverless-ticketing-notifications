[project]
name = "ticketstream"
version = "0.1.0"
description = "API para gerenciamento e reserva de ingressos em eventos"
readme = "README.md"
authors = [
    { name = "Filipe Rodrigues", email = "filipe.rds.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.31.1",
    "boto3>=1.43.42",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]
