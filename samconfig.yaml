version: 0.1

local-dev:
  deploy:
    parameters:
      capabilities: CAPABILITY_IAM
      confirm_changeset: false
      fail_on_empty_changeset: false
      resolve_s3: false
      parameter_overrides: ApiStageName=dev
  delete:
    parameters:
      region: sa-east-1
      no_prompts: true

local-prod:
  deploy:
    parameters:
      capabilities: CAPABILITY_IAM
      confirm_changeset: false
      fail_on_empty_changeset: false
      resolve_s3: false
      parameter_overrides: ApiStageName=prod
  delete:
    parameters:
      region: sa-east-1
      no_prompts: true

dev:
  deploy:
    parameters:
      region: sa-east-1
      capabilities: CAPABILITY_IAM
      confirm_changeset: true
      fail_on_empty_changeset: false
      resolve_s3: true
      parameter_overrides: ApiStageName=dev
  delete:
    parameters:
      region: sa-east-1
      no_prompts: true

prod:
  deploy:
    parameters:
      region: sa-east-1
      capabilities: CAPABILITY_IAM
      confirm_changeset: true
      fail_on_empty_changeset: false
      resolve_s3: true
      parameter_overrides: ApiStageName=prod
  delete:
    parameters:
      region: sa-east-1
      no_prompts: false
